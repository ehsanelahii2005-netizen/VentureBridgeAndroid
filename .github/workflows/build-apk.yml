
name: Build VentureBridge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p build-src
          unzip -q VentureBridgeAndroid-CloudBuild.zip -d build-src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Fix JVM targets
        working-directory: build-src/VentureBridgeAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "sourceCompatibility JavaVersion.VERSION_17",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace(
              "targetCompatibility JavaVersion.VERSION_17",
              "targetCompatibility = JavaVersion.VERSION_17"
          )
          p.write_text(s)
          PY


      - name: Build APK
        working-directory: build-src/VentureBridgeAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VentureBridge-APK
          path: build-src/VentureBridgeAndroid/app/build/outputs/apk/debug/*.apk
